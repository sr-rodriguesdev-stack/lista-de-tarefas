<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Lista de tarefas</h1>
        <form>
            <input id="taskInput" type="text" placeholder="Digite uma nova tarefa" required>
            <button id="addTaskButton" class="addBtn" type="button">Adicionar</button>
        </form>

        <ul id="taskList">
            <li class="taskItem">tarefa 1 <button class="deleteBtn">X</button></li>
        </ul>
    </main>
    <script src="script.js"></script>
</body>
</html>
